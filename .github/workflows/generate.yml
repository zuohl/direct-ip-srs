name: Generate FCM SRS

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install sing-box
        run: |
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo mv /tmp/sing-box-1.13.14-linux-amd64/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Generate rule-set
        run: |
          set +e
          python3 generate.py
          code=$?
          set -e
          if [ $code -eq 2 ]; then
            echo "UPSTREAM_UNCHANGED=true" >> "$GITHUB_ENV"
          elif [ $code -ne 0 ]; then
            echo "FATAL: generate.py exited with code $code"
            exit $code
          fi

      - name: Commit and push
        if: env.UPSTREAM_UNCHANGED != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fcm_dual_ip.json fcm_dual_ip.srs fcm_dual_ip.version
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update FCM rule-set $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Skip message
        if: env.UPSTREAM_UNCHANGED == 'true'
        run: echo "Upstream unchanged, skipping commit"
